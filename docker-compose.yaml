services:

  ##############
  # MEDIA SERVER
  ##############

  rms:
    image: pixelotes/rms:arm64
    container_name: rms
    profiles: ["rms"]
    restart: unless-stopped
    ports:
      - "8096:8082"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
    volumes:
      - "${MEDIA_DIR}:/app/media"
      - "${CONFIG_DIR}/rms:/app/config"
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 16m

  ###########
  # HOMEPAGE
  ###########

  dashboarr:
    image: pixelotes/dashboarr:arm64
    container_name: dashboarr
    profiles: ["dashboarr"]
    ports:
      - "3000:80"
    volumes:
      - "${CONFIG_DIR}/dashboarr/services.json:/var/www/localhost/htdocs/services.json:ro"
    deploy:
      resources:
        limits:
          memory: 8m
        reservations:
          memory: 6m
    restart: unless-stopped

  #################
  # TORRENT CLIENT
  #################

  tango:
    image: pixelotes/tango:arm64
    container_name: tango
    profiles: ["tango"]
    restart: unless-stopped
    ports:
      - "7246:7246"
      - "6881:6881"
    volumes:
      - "${CONFIG_DIR}/tango/config.yaml:/tango/config.yaml"
      - "${CONFIG_DIR}/tango/session:/tango/session"
      - "${BASE_DIR}:/storage"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
    deploy:
      resources:
        limits:
          memory: 192m
          cpus: "1.0"
        reservations:
          memory: 64m

  #################
  # INDEXER MANAGER
  #################

  scarf:
    image: pixelotes/scarf:arm64
    container_name: scarf
    profiles: ["scarf"]
    ports:
      - "8080:8080"
    volumes:
      - "${CONFIG_DIR}/scarf/data:/app/data"
      - "${CONFIG_DIR}/scarf/definitions:/app/definitions"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
      - "WEB_UI=true"
      - "DEBUG=false"
      - "DB_PATH=/app/data/indexer-cache.db"
      - "UI_PASSWORD=${SCARF_UI_PASSWORD}"
      - "SKIP_TLS_VERIFY=true"
      - "JWT_SECRET=${SCARF_JWT_SECRET}"
      - "DEFAULT_API_LIMIT=300"
      - "CACHE_TTL=30m"
      - "ENABLE_CRONJOBS=false"
      - "CACHE_ENABLED=true"
      - "MAX_CACHE_SIZE_MB=32"
      - "MAX_CONCURRENT_SEARCHES=3"
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m
    restart: unless-stopped

  ##################
  # MEDIA DOWNLOADER
  ##################

  reel:
    image: pixelotes/reel:arm64
    container_name: reel
    profiles: ["reel"]
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - "${CONFIG_DIR}/reel/config.yml:/app/config/config.yml"
      - "${CONFIG_DIR}/reel/data:/app/data"
      - "${BASE_DIR}:/storage"
    environment:
      - "TZ=${TZ}"
      - "PUID=${PUID}"
      - "PGID=${PGID}"
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m

  ##############
  # MUSIC SERVER
  ##############

  kaze:
    image: pixelotes/kaze:arm64
    container_name: kaze
    profiles: ["kaze"]
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
      # Aggressive GC: this is a low-throughput server, we prefer trimming
      # heap headroom over CPU cycles. Tune up if scans get sluggish.
      - "GOGC=20"
      - "GOMEMLIMIT=32MiB"
    volumes:
      - "${CONFIG_DIR}/kaze:/app/config"
      - "${MEDIA_DIR}/Music:/app/media:ro"
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m

  ##############
  # EBOOK READER
  ##############

  sumi:
    image: pixelotes/sumi:arm64
    container_name: sumi
    profiles: ["sumi"]
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
      - "GOGC=20"
      - "GOMEMLIMIT=32MiB"
    volumes:
      - "${CONFIG_DIR}/sumi:/app/config"
      - "${MEDIA_DIR}/Ebooks:/app/media:ro"
    deploy:
      resources:
        limits:
          memory: 64m
        reservations:
          memory: 16m

  ##############
  # MANGA READER
  ##############

  suika:
    image: pixelotes/suika:arm64
    container_name: suika
    profiles: ["suika"]
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - "PUID=${PUID}"
      - "PGID=${PGID}"
      - "TZ=${TZ}"
    volumes:
      - "${CONFIG_DIR}/suika:/app/config"
      - "${MEDIA_DIR}/Manga:/app/media:ro"
    deploy:
      resources:
        limits:
          memory: 192m
        reservations:
          memory: 8m
